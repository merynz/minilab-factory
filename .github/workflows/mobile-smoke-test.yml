name: Mobile Android Smoke Test

on:
  workflow_dispatch:
    inputs:
      game_path:
        description: 'Game path, for example: Games/Game_Arcade_MyGame'
        required: true
        type: string
      duration_seconds:
        description: 'Monkey smoke duration in seconds'
        required: false
        default: '300'
        type: string

jobs:
  smoke-android:
    runs-on: [self-hosted, windows, minilab-unity]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android smoke test
        shell: pwsh
        run: |
          .\tools\smoke-android.ps1 `
            -GamePath "${{ inputs.game_path }}" `
            -DurationSeconds ([int]"${{ inputs.duration_seconds }}")

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-artifacts
          path: BuildArtifacts/QA
